<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blason terminal</title>
<style>
  :root {
    --color-bg: #0A0A0A;
    --color-a: #6B7EC4;
    --color-b: #8A9AD4;
    --color-hazard: #E61919;
  }
  html, body {
    margin: 0; min-height: 100dvh;
    background: var(--color-bg); color: var(--color-b);
    font-family: monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; box-sizing: border-box;
  }
  #blason-out {
    margin: 0; line-height: 1; letter-spacing: 0;
    font-size: clamp(4px, 1.4vw, 11px);
    white-space: pre; background: var(--color-bg);
  }
  #blason-out span { display: inline; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  #blason-prompt { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 520px; }
  #blason-prompt span { color: var(--color-a); white-space: nowrap; }
  #blason-field { position: relative; flex: 1; display: flex; }
  #blason-input {
    flex: 1; background: var(--color-bg); color: var(--color-b);
    border: none; outline: none; padding: 10px 0; font-family: monospace;
    font-size: 16px; min-height: 44px; box-sizing: border-box;
    caret-color: transparent; /* curseur natif masqué → bloc custom ci-dessous */
  }
  /* Curseur bloc plein, façon vrai terminal — positionné en JS (monospace). */
  #blason-cursor {
    position: absolute; top: 50%; transform: translateY(-50%);
    height: 1.2em; font-size: 16px; background: var(--color-b);
    pointer-events: none; opacity: 0;
  }
  #blason-cursor.on { animation: blason-blink 1.06s steps(1) infinite; }
  @keyframes blason-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  #blason-banner {
    margin: 0; color: var(--color-a); font-size: 13px; line-height: 1.3;
    width: 100%; max-width: 520px;
  }
  #blason-log {
    margin: 0; width: 100%; max-width: 520px; font-size: 13px; line-height: 1.4;
    white-space: pre-wrap; color: var(--color-b);
  }
  #blason-log .log-error { color: var(--color-hazard); }
  #blason-seed {
    font-size: 12px; color: var(--color-a); letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <canvas id="blason-canvas" width="1080" height="1350" style="display:none"></canvas>
  <pre id="blason-banner">▗▖ ▗▖▗▄▄▄▖▗▄▄▖  ▗▄▖ ▗▖   ▗▄▄▄ ▗▄▄▄▖ ▗▄▄▖
▐▌ ▐▌▐▌   ▐▌ ▐▌▐▌ ▐▌▐▌   ▐▌  █  █  ▐▌
▐▛▀▜▌▐▛▀▀▘▐▛▀▚▖▐▛▀▜▌▐▌   ▐▌  █  █  ▐▌
▐▌ ▐▌▐▙▄▄▖▐▌ ▐▌▐▌ ▐▌▐▙▄▄▖▐▙▄▄▀▗▄█▄▖▝▚▄▄▖
TERMINAL v2.6 — tape /help</pre>
  <div id="blason-log"></div>
  <div id="blason-prompt">
    <label for="blason-input" class="sr-only">Mot-clé ou phrase à transformer en blason, ou commande /help</label>
    <span aria-hidden="true">heraldic:~$</span>
    <div id="blason-field">
      <input id="blason-input" type="text" autocomplete="off" spellcheck="false" autofocus>
      <span id="blason-cursor" aria-hidden="true"></span>
    </div>
  </div>
  <pre id="blason-out"></pre>
  <div id="blason-seed"></div>

  <script id="blason-script">
    const COLS = 80;
    const ROWS = 50;
    const DOT_W = COLS * 2;   // 160
    const DOT_H = ROWS * 4;   // 200

    function hashString(text) {
      let hash = 5381;
      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) + hash) + text.charCodeAt(i);
        hash = hash >>> 0;
      }
      return hash >>> 0;
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function slugify(text) {
      const slug = text
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 40);
      return slug.length > 0 ? slug : 'blason';
    }

    // Export incrémental : évite qu'une ligne d'export partagée soit éditée par
    // plusieurs tâches (source de conflits). Chaque tâche AJOUTE son propre bloc
    // Object.assign JUSTE après ses fonctions, à l'ancre PURE ci-dessous.
    if (typeof module !== 'undefined' && module.exports) {
      Object.assign(module.exports, { COLS, ROWS, DOT_W, DOT_H, hashString, mulberry32, slugify });
    }

    function makeEntropy() {
      // Vrai aléa — SEUL usage de crypto, côté runtime. Non couvert par les tests
      // (buildGrid reçoit une entropy explicite pour rester déterministe en test).
      return crypto.getRandomValues(new Uint32Array(1))[0] >>> 0;
    }

    function gaussianRandom(rng) {
      let u = 0, v = 0;
      while (u === 0) u = rng();
      while (v === 0) v = rng();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    function deriveParams(familyRng, variantRng) {
      // MACRO (stable par texte) — piloté par familyRng
      const symmetryOptions = [
        { type: 'axial', k: 2 },
        { type: 'radial', k: 3, mirror: true },
        { type: 'radial', k: 4, mirror: true },
        { type: 'radial', k: 6 },
        { type: 'radial', k: 8 },
      ];
      const symmetry = symmetryOptions[Math.floor(familyRng() * symmetryOptions.length)];
      const sectorAngle = symmetry.type === 'axial' ? Math.PI : (2 * Math.PI / symmetry.k);
      const paletteBias = familyRng();
      const densityBand = 1.1 + familyRng() * 1.0; // densité macro relevée

      // MICRO (variable par tirage) — piloté par variantRng
      const clusterCount = 3 + Math.floor(variantRng() * 5); // 3..7
      const clusters = [];
      for (let i = 0; i < clusterCount; i++) {
        clusters.push({
          angle: variantRng() * sectorAngle,
          distance: 0.15 + variantRng() * 0.75,
          radius: 0.10 + variantRng() * 0.16,
          particleCount: Math.ceil(Math.floor((260 + variantRng() * 420) * densityBand) / (symmetry.mirror ? 2 : 1)),
        });
      }
      const jitter = 0.3 + variantRng() * 0.5;

      return { symmetry, sectorAngle, clusters, jitter, paletteBias, densityBand };
    }

    if (typeof module !== 'undefined' && module.exports) Object.assign(module.exports, { makeEntropy, gaussianRandom, deriveParams });

    function overlayStructural(cells, params) {
      const rows = cells.length, cols = cells[0].length;
      const put = (r, c, ch, layer) => {
        if (r >= 0 && r < rows && c >= 0 && c < cols) {
          cells[r][c] = { char: ch, intensity: 1, layer: layer || 'struct' };
        }
      };
      // Cadre en glyphes BRAILLE plutôt qu'en box-drawing. Raison : le braille
      // de l'intérieur et les box-drawing (─│┌…) n'ont pas la même avance dans
      // la police monospace fallback → le cadre se décalait et paraissait « mal
      // fermé ». Un cadre braille partage exactement la largeur de l'intérieur
      // → alignement parfait, fermeture garantie, et cohérence esthétique.
      //   ⠉ ligne haute · ⣀ ligne basse · ⡇ montant gauche · ⢸ montant droit
      //   ⡏ coin HG · ⢹ coin HD · ⣇ coin BG · ⣸ coin BD
      for (let c = 0; c < cols; c++) { put(0, c, '⠉'); put(rows - 1, c, '⣀'); }
      for (let r = 0; r < rows; r++) { put(r, 0, '⡇'); put(r, cols - 1, '⢸'); }
      put(0, 0, '⡏'); put(0, cols - 1, '⢹'); put(rows - 1, 0, '⣇'); put(rows - 1, cols - 1, '⣸');
      return cells;
    }

    function formatSeedLine(meta) {
      const hex = (meta.seed >>> 0).toString(16).toUpperCase().padStart(8, '0');
      return `SEED 0x${hex}  REV ${meta.rev}  ${meta.unit}`;
    }

    if (typeof module !== 'undefined' && module.exports) {
      Object.assign(module.exports, { overlayStructural, formatSeedLine });
    }

    function parseColor(color) {
      if (color[0] === '#') {
        return [parseInt(color.slice(1, 3), 16), parseInt(color.slice(3, 5), 16), parseInt(color.slice(5, 7), 16)];
      }
      const m = color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
      return m ? [+m[1], +m[2], +m[3]] : [255, 255, 255];
    }

    function serializeText(grid) {
      const art = grid.cells.map(row => row.map(c => c.char).join('')).join('\n');
      return `${art}\n\n${formatSeedLine(grid.meta)}`;
    }

    function serializeAnsi(grid) {
      const RESET = '\x1b[0m';
      const art = grid.cells.map(row => {
        let line = '', last = null;
        for (const cell of row) {
          if (cell.color !== last) {
            const [r, g, b] = parseColor(cell.color);
            line += `\x1b[38;2;${r};${g};${b}m`;
            last = cell.color;
          }
          line += cell.char;
        }
        return line + RESET;
      }).join('\n');
      return `${art}\n\n${formatSeedLine(grid.meta)}`;
    }

    if (typeof module !== 'undefined' && module.exports) {
      Object.assign(module.exports, { parseColor, serializeText, serializeAnsi });
    }

    function generateParticles(params, rng, width, height) {
      const cx = width / 2, cy = height / 2;
      const maxRadius = Math.min(width, height) * 0.42;
      const particles = [];
      for (const cluster of params.clusters) {
        const baseAngle = cluster.angle - Math.PI / 2;
        const baseX = cx + Math.cos(baseAngle) * cluster.distance * maxRadius;
        const baseY = cy + Math.sin(baseAngle) * cluster.distance * maxRadius;
        const centers = [];
        if (params.symmetry.type === 'axial') {
          centers.push([baseX, baseY]);
          centers.push([2 * cx - baseX, baseY]);
        } else {
          // mirror (k=3, k=4) : chaque branche a son reflet, jamais de moulinet
          for (let k = 0; k < params.symmetry.k * (params.symmetry.mirror ? 2 : 1); k++) {
            const rot = (k < params.symmetry.k ? baseAngle : -cluster.angle - Math.PI / 2)
              + (k % params.symmetry.k) * params.sectorAngle;
            centers.push([
              cx + Math.cos(rot) * cluster.distance * maxRadius,
              cy + Math.sin(rot) * cluster.distance * maxRadius,
            ]);
          }
        }
        for (const [ccx, ccy] of centers) {
          for (let p = 0; p < cluster.particleCount; p++) {
            const r = Math.abs(gaussianRandom(rng)) * cluster.radius * maxRadius * params.jitter;
            const theta = rng() * Math.PI * 2;
            particles.push({ x: ccx + Math.cos(theta) * r, y: ccy + Math.sin(theta) * r });
          }
        }
      }
      return particles;
    }

    function rasterizeToDotField(particles, dotW, dotH) {
      const field = new Float64Array(dotW * dotH);
      for (const pt of particles) {
        const x = Math.round(pt.x), y = Math.round(pt.y);
        if (x >= 0 && x < dotW && y >= 0 && y < dotH) field[y * dotW + x] += 1;
      }
      let max = 0;
      for (let i = 0; i < field.length; i++) if (field[i] > max) max = field[i];
      if (max > 0) for (let i = 0; i < field.length; i++) field[i] /= max;
      return field;
    }

    if (typeof module !== 'undefined' && module.exports) {
      Object.assign(module.exports, { generateParticles, rasterizeToDotField });
    }

    // T3: Champ de points → grille braille
    // Disposition des points braille (Unicode) par [dy][dx] :
    //   dot1 dot4      0x01 0x08
    //   dot2 dot5      0x02 0x10
    //   dot3 dot6      0x04 0x20
    //   dot7 dot8      0x40 0x80
    const BRAILLE_BITS = [
      [0x01, 0x08],
      [0x02, 0x10],
      [0x04, 0x20],
      [0x40, 0x80],
    ];

    // Gamma appliqué à chaque sous-point avant seuillage. < 1 relève les
    // demi-tons du champ (dont la queue faible est écrasée par la normalisation
    // au pic) → plus de sous-points passent le seuil → braille nettement plus
    // dense et lisible, sans changer la structure (fonction toujours pure).
    const FIELD_GAMMA = 0.55;

    // Champ de points → grille braille. Le braille est une rampe de densité
    // intrinsèque (0 à 8 points par cellule) → dégradé fin et cohérent, l'aspect
    // qui « rend bien ». Densité assurée par le gamma (relève les demi-tons) et
    // un seuil bas. 100% déterministe (aucun tirage RNG) → même texte → même image.
    function dotFieldToBraille(dotField, cols, rows, threshold) {
      if (threshold === undefined) threshold = 0.06;
      const dotW = cols * 2;
      const cells = [];
      for (let ry = 0; ry < rows; ry++) {
        const row = [];
        for (let cx = 0; cx < cols; cx++) {
          let bits = 0, sum = 0;
          for (let dy = 0; dy < 4; dy++) {
            for (let dx = 0; dx < 2; dx++) {
              const raw = dotField[(ry * 4 + dy) * dotW + (cx * 2 + dx)];
              const v = raw > 0 ? Math.pow(raw, FIELD_GAMMA) : 0;
              sum += v;
              if (v > threshold) bits |= BRAILLE_BITS[dy][dx];
            }
          }
          row.push({ char: String.fromCharCode(0x2800 + bits), intensity: sum / 8, layer: 'braille' });
        }
        cells.push(row);
      }
      return cells;
    }

    if (typeof module !== 'undefined' && module.exports) {
      Object.assign(module.exports, { dotFieldToBraille });
    }

    function escapeXml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function serializeSvg(grid, opts) {
      opts = opts || {};
      const cw = opts.cellW || 13.5, ch = opts.cellH || 27, fs = opts.fontSize || 24;
      const w = grid.cols * cw, h = (grid.rows + 1) * ch;
      let out = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
      out += `<rect width="${w}" height="${h}" fill="#0A0A0A"/>`;
      out += `<g font-family="monospace" font-size="${fs}" xml:space="preserve">`;
      for (let r = 0; r < grid.rows; r++) {
        const y = ((r + 0.8) * ch).toFixed(1);
        for (let c = 0; c < grid.cols; c++) {
          const cell = grid.cells[r][c];
          if (cell.char === ' ' || cell.char === '⠀') continue;
          const x = (c * cw).toFixed(1);
          out += `<text x="${x}" y="${y}" fill="${cell.color}">${escapeXml(cell.char)}</text>`;
        }
      }
      const seedY = ((grid.rows + 0.8) * ch).toFixed(1);
      out += `<text x="0" y="${seedY}" fill="#8A9AD4">${escapeXml(formatSeedLine(grid.meta))}</text>`;
      out += `</g></svg>`;
      return out;
    }

    if (typeof module !== 'undefined' && module.exports) {
      Object.assign(module.exports, { escapeXml, serializeSvg });
    }

    function colorize(cells, params) {
      const A = [0x6B, 0x7E, 0xC4], B = [0x8A, 0x9A, 0xD4];
      const rows = cells.length, cols = cells[0].length;
      const bias = (params && typeof params.paletteBias === 'number') ? params.paletteBias : 0.5;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = cells[r][c];
          // layer:'data' n'est plus émis par overlayStructural depuis Task 1 — conservé pour compat descendante avec d'éventuels appelants externes de colorize()
          if (cell.layer === 'data') {
            cell.color = '#E61919';
          } else if (cell.layer === 'struct') {
            cell.color = '#8A9AD4';
          } else {
            const t = Math.min(1, Math.max(0, cell.intensity * 0.7 + bias * 0.3));
            const col = [
              Math.round(A[0] + (B[0] - A[0]) * t),
              Math.round(A[1] + (B[1] - A[1]) * t),
              Math.round(A[2] + (B[2] - A[2]) * t),
            ];
            cell.color = `rgb(${col[0]}, ${col[1]}, ${col[2]})`;
          }
        }
      }
      return { cols, rows, cells };
    }

    function buildGrid(text, entropy, opts) {
      opts = opts || {};
      const cols = opts.cols || COLS, rows = opts.rows || ROWS;
      const dotW = cols * 2, dotH = rows * 4;
      const textHash = hashString(text);
      const seed = (textHash ^ (entropy >>> 0)) >>> 0;
      const familyRng = mulberry32(textHash);
      const variantRng = mulberry32(seed);
      const params = deriveParams(familyRng, variantRng);
      const particles = generateParticles(params, variantRng, dotW, dotH);
      const field = rasterizeToDotField(particles, dotW, dotH);
      let cells = dotFieldToBraille(field, cols, rows);
      const meta = { seed, rev: '2.6', unit: 'UNIT/D-01' };
      cells = overlayStructural(cells, params);
      const grid = colorize(cells, params);
      grid.seed = seed;
      grid.meta = meta;
      return grid;
    }

    if (typeof module !== 'undefined' && module.exports) {
      Object.assign(module.exports, { colorize, buildGrid });
    }
  </script>

  <script id="blason-ui">

    function renderToCanvas(ctx, grid, w, h) {
      const cw = w / grid.cols, ch = h / (grid.rows + 1);
      ctx.fillStyle = '#0A0A0A';
      ctx.fillRect(0, 0, w, h);
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.font = `${Math.floor(ch * 0.9)}px monospace`;
      for (let r = 0; r < grid.rows; r++) {
        for (let c = 0; c < grid.cols; c++) {
          const cell = grid.cells[r][c];
          if (cell.char === ' ' || cell.char === '⠀') continue;
          ctx.fillStyle = cell.color;
          ctx.fillText(cell.char, c * cw + cw / 2, r * ch + ch / 2);
        }
      }
      ctx.fillStyle = '#8A9AD4';
      ctx.textAlign = 'left';
      ctx.font = `${Math.floor(ch * 0.5)}px monospace`;
      ctx.fillText(formatSeedLine(grid.meta), cw * 0.3, grid.rows * ch + ch / 2);
    }

    function cellSpan(ch, color) {
      const safe = ch === '<' ? '&lt;' : ch === '&' ? '&amp;' : ch;
      return `<span style="color:${color}">${safe}</span>`;
    }

    function renderToDom(grid, pre) {
      let html = '';
      for (let r = 0; r < grid.rows; r++) {
        for (let c = 0; c < grid.cols; c++) {
          const cell = grid.cells[r][c];
          html += cellSpan(cell.char, cell.color);
        }
        if (r < grid.rows - 1) html += '\n';
      }
      pre.innerHTML = html;
    }

    let decodeGeneration = 0;

    function renderDecode(grid, pre) {
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { decodeGeneration++; renderToDom(grid, pre); return; }

      const myGeneration = ++decodeGeneration;
      const SCRAMBLE = '⠿⣿⢿⡿⣻⠷█▓▒░/\\|+°';
      const rng = mulberry32(grid.seed >>> 0);
      const cx = grid.cols / 2, cy = grid.rows / 2;
      const maxD = Math.hypot(cx, cy);
      const DUR = 500, STAGGER = 500;
      const start = performance.now();

      function frame(now) {
        if (myGeneration !== decodeGeneration) return; // une génération plus récente a pris le relais
        const t = now - start;
        let done = true;
        let html = '';
        for (let r = 0; r < grid.rows; r++) {
          for (let c = 0; c < grid.cols; c++) {
            const cell = grid.cells[r][c];
            const d = Math.hypot(c - cx, r - cy) / maxD;
            const cellStart = d * STAGGER;
            if (t >= cellStart + DUR) {
              html += cellSpan(cell.char, cell.color);
            } else if (t < cellStart) {
              html += cellSpan(cell.char === '⠀' ? '⠀' : ' ', cell.color);
              done = false;
            } else {
              const ch = SCRAMBLE[Math.floor(rng() * SCRAMBLE.length)];
              html += cellSpan(ch, cell.color);
              done = false;
            }
          }
          if (r < grid.rows - 1) html += '\n';
        }
        pre.innerHTML = html;
        if (!done) requestAnimationFrame(frame);
        else renderToDom(grid, pre);
      }
      requestAnimationFrame(frame);
    }

    const input = document.getElementById('blason-input');
    const out = document.getElementById('blason-out');
    const logEl = document.getElementById('blason-log');
    const seedEl = document.getElementById('blason-seed');

    let currentText = '';
    let currentEntropy = 0;
    let currentGrid = null;

    function logLine(text, opts) {
      const div = document.createElement('div');
      if (opts && opts.error) div.className = 'log-error';
      div.textContent = text;
      logEl.appendChild(div);
    }

    function generate(text, entropy) {
      currentText = text;
      currentEntropy = entropy >>> 0;
      currentGrid = buildGrid(text, currentEntropy);
      renderDecode(currentGrid, out);
      seedEl.textContent = formatSeedLine(currentGrid.meta);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    const EXPORT_FORMATS = ['png', 'txt', 'copy', 'ans', 'svg'];

    function runExport(fmt) {
      if (fmt === 'png') {
        const cv = document.getElementById('blason-canvas');
        renderToCanvas(cv.getContext('2d'), currentGrid, cv.width, cv.height);
        cv.toBlob((blob) => downloadBlob(blob, `${slugify(currentText)}.png`), 'image/png');
      } else if (fmt === 'copy') {
        navigator.clipboard.writeText(serializeText(currentGrid));
      } else if (fmt === 'txt') {
        downloadBlob(new Blob([serializeText(currentGrid)], { type: 'text/plain' }), `${slugify(currentText)}.txt`);
      } else if (fmt === 'ans') {
        downloadBlob(new Blob([serializeAnsi(currentGrid)], { type: 'text/plain' }), `${slugify(currentText)}.ans`);
      } else if (fmt === 'svg') {
        downloadBlob(new Blob([serializeSvg(currentGrid)], { type: 'image/svg+xml' }), `${slugify(currentText)}.svg`);
      }
    }

    function requireGrid() {
      if (!currentGrid) {
        logLine(`aucun blason généré — tape un mot d\u2019abord`, { error: true });
        return false;
      }
      return true;
    }

    const COMMANDS = {
      help() {
        logLine([
          'commandes disponibles :',
          '  <texte>              génère un blason à partir du texte',
          '  /reroll              nouveau tirage du même texte',
          '  /export <fmt>        exporte le dernier blason (fmt: png, txt, copy, ans, svg)',
          '  /clear                vide l\u2019historique affiché',
          '  /help                 affiche cette liste',
        ].join('\n'));
      },
      reroll() {
        if (!requireGrid()) return;
        generate(currentText, makeEntropy());
      },
      clear() {
        logEl.innerHTML = '';
      },
    };

    function handleExport(arg) {
      if (!arg || !EXPORT_FORMATS.includes(arg)) {
        logLine(`format invalide — formats: ${EXPORT_FORMATS.join(', ')}`, { error: true });
        return;
      }
      if (!requireGrid()) return;
      runExport(arg);
    }

    function handleLine(raw) {
      const text = raw.trim();
      if (text.length === 0) return;
      logLine(`heraldic:~$ ${raw}`);
      if (text[0] === '/') {
        const [name, ...rest] = text.slice(1).split(/\s+/);
        const key = name.toLowerCase();
        if (key === 'export') { handleExport(rest[0] ? rest[0].toLowerCase() : undefined); return; }
        if (Object.hasOwn(COMMANDS, key)) { COMMANDS[key](); return; }
        logLine(`commande inconnue: /${name} — tape /help`, { error: true });
        return;
      }
      generate(text, makeEntropy());
    }

    // ── Curseur bloc terminal ──────────────────────────────────────────────
    // Le caret natif est masqué (caret-color: transparent). On dessine un bloc
    // plein positionné sur la colonne du caret. L'input est monospace → chaque
    // caractère fait exactement charW px, donc left = position * charW.
    const cursorEl = document.getElementById('blason-cursor');

    function charWidth() {
      const cs = getComputedStyle(input);
      const cv = document.createElement('canvas').getContext('2d');
      cv.font = `${cs.fontSize} ${cs.fontFamily}`;
      return cv.measureText('M').width;
    }
    let charW = charWidth();
    cursorEl.style.width = `${charW}px`;

    function updateCursor() {
      const pos = input.selectionStart == null ? input.value.length : input.selectionStart;
      cursorEl.style.left = `${pos * charW - input.scrollLeft}px`;
    }

    for (const ev of ['input', 'keyup', 'click', 'scroll']) {
      input.addEventListener(ev, updateCursor);
    }
    input.addEventListener('focus', () => { cursorEl.classList.add('on'); updateCursor(); });
    input.addEventListener('blur', () => cursorEl.classList.remove('on'));
    window.addEventListener('resize', () => {
      charW = charWidth();
      cursorEl.style.width = `${charW}px`;
      updateCursor();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const raw = input.value;
      input.value = '';
      handleLine(raw);
      updateCursor();
    });

    // État initial (l'input a autofocus).
    if (document.activeElement === input) cursorEl.classList.add('on');
    updateCursor();
  </script>
</body>
</html>
